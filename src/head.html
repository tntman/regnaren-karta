<!doctype html>
<html lang="sv">
<head>
<meta charset="utf-8">
<!-- dark: the browser's own empty canvas before anything is drawn (else white -- a white blink at start); the page
     itself keeps its look (body: light, as before -- the early <style> below) -->
<meta name="color-scheme" content="dark">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<!-- NOT "black-translucent": with translucent, iOS 26 home-screen apps get a web view a status bar
     too short -- an empty band at the bottom that nothing can draw in (WebKit bug 301108).
     "default" puts the page below the status bar (full height, no band) like "black", but lets the
     bar take the theme-color below: the app's dark blue, the same as the map's background and the
     fade at the top -- no edge (with "black" the bar was black). -->
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>FF Map</title>
<meta name="apple-mobile-web-app-title" content="FF Map">
<!-- the status bar's colour (see above) = the map's background = the top fade: #141822 -->
<meta name="theme-color" content="#141822">
<!-- the start picture, like a native app's: the logo on the dark blue (= the status bar) from the very first
     picture -- the html's own background, before the page's <style> and body -- then the app fades in over it
     (html.boot, js/35-splash.js). The same as iOS's launch images below (tools/launch_images.py makes them from
     this rule). Not on a rotation's reload. (Tried: on black with the blue fading in at the top -- it showed as an edge.) -->
<script>try{var c=document.documentElement.classList;if(!window.__ffNoBoot&&!sessionStorage.getItem('ffmap_rotation_state_v1'))c.add('boot')}catch(e){}</script>
<style>html{background:#141822;--ffLogo:url(__LOGO__)}
html.boot,html.booted{background:#141822 var(--ffLogo) no-repeat 50% 50%/min(46vw,240px) auto}
html.boot body{opacity:0;background:none}html.booted body{transition:opacity 1.2s}body{color-scheme:light}</style>
